# =============================================================================
# MinIO Docker Stack
# =============================================================================
#
# Ports:
#   9000 → S3 API Endpoint
#   9001 → MinIO Web Console
#
# Volumes:
#   ./data → Bind-mounted host directory (portable, easy to backup)
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f minio
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MinIO Server
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-server
    restart: unless-stopped

    env_file:
      - .env

    command: server /data --console-address ":9001"

    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web Console

    volumes:
      - ./data:/data   # Bind mount — data lives on host at ./data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - minio_net

  # ---------------------------------------------------------------------------
  # MinIO Init Container
  # Runs once on startup to:
  #   - Wait for MinIO to be healthy
  #   - Create all buckets listed in MINIO_BUCKETS
  #   - Set public download policy on each bucket
  #   - Add lifecycle expiration rule (MINIO_EXPIRE_DAYS)
  # ---------------------------------------------------------------------------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - ./scripts/init.sh:/init.sh:ro

    entrypoint: ["/bin/sh", "/init.sh"]

    networks:
      - minio_net

# =============================================================================
# Networks
# =============================================================================
networks:
  minio_net:
    driver: bridge
